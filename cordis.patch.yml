# DSWhale plugin rows — merge this insert into your profile's cordis.patch.yml
# (e.g. C:\Users\<you>\.dsh\profiles\web\cordis.patch.yml).
#
# One row is enough: the row mounts the host half from the package main, and
# @deepseek-ai/dsh-client-modules automatically serves the browser half because
# the package declares dsh.client: { platform: 'web' }.
#
# To disable without uninstalling, add below the insert:
#   - id: whale
#     disabled: true
# To re-enable, set disabled: false (or remove that entry).
- insert:
    - id: whale
      name: '@spartaattack/dsh-whale-copilot'
