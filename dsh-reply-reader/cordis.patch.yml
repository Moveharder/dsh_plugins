# dsh-reply-reader bundle patch — declared by `dsh.bundle.patch` in package.json
# and applied automatically as a profile layer by
# `dsh plugin --profile web add dsh-reply-reader` (no manual merge needed).
#
# One row mounts the host half (version + online-update routes under /read-aloud);
# @deepseek-ai/dsh-client-modules automatically serves the browser half because
# the package declares dsh.client: { platform: 'web' }.
#
# To disable without uninstalling, disable the row in your profile's cordis.patch.yml
# (it outranks this bundle layer):
#   - id: read-aloud
#     disabled: true
- insert:
    - id: read-aloud
      name: 'dsh-reply-reader'
